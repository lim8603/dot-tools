name: Auto-close pull requests

# This repository does not accept external contributions (see CONTRIBUTING.md).
# pull_request_target (not pull_request) so the workflow has a write token for
# PRs from forks; safe because it never checks out or runs PR code.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body: [
                'Thanks for your interest in DevSwitcher Tools!',
                '',
                'This is a personal project and does not accept external code contributions,',
                'so pull requests are closed automatically (see CONTRIBUTING.md).',
                'Bug reports and feedback are very welcome in',
                '[Issues](https://github.com/lim8603/dot-tools/issues).',
              ].join('\n'),
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr,
              state: 'closed',
            });
